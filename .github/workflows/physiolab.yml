name: PhysioLab platform
on:
  push:
    paths: ['physiolab/**', '.github/workflows/physiolab.yml']
  pull_request:
    paths: ['physiolab/**', '.github/workflows/physiolab.yml']
jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physiolab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: physiolab/web/package-lock.json
      - run: make setup
      - run: make check
      - run: cd web && npm run format:check
      - name: Check generated contracts
        run: |
          make schema
          git diff --exit-code -- docs/openapi.json web/src/lib/schema.d.ts
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npm run test:e2e
      - name: Build and smoke-test deployment image
        run: |
          docker build -t physiolab-demo .
          docker run -d --rm -p 8000:8000 --name physiolab-smoke physiolab-demo
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:8000/ | grep "PhysioLab"
          docker stop physiolab-smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: physiolab-browser-evidence
          path: physiolab/web/test-results/
