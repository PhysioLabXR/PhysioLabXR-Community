[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physiolab-platform"
version = "0.1.0"
description = "PhysioLab physiological pipeline builder — collaborator starter"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "numpy>=2,<3", "scipy>=1.14,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/physiolab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
